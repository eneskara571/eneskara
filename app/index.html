<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cep Asistanı</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0f7b62">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cep">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;700&display=swap">
<style>
/* Layout: tek ekranlı uygulama — üstte başlık, ortada kayan içerik, altta sabit sekme çubuğu */
:root {
  --bg: #eef2f0; --surface: #ffffff; --ink: #14211d; --muted: #5d6d67;
  --line: #d7dfdb; --accent: #0f7b62; --accent-ink: #ffffff; --accent-soft: #d6ece5;
  --warm: #c9821c; --danger: #b8432f;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1412; --surface: #17201d; --ink: #e6efeb; --muted: #93a49e;
  --line: #2a3632; --accent: #3fbf98; --accent-ink: #062018; --accent-soft: #1d3a31;
  --warm: #e4a64a; --danger: #ec7a63; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1412; --surface: #17201d; --ink: #e6efeb; --muted: #93a49e;
  --line: #2a3632; --accent: #3fbf98; --accent-ink: #062018; --accent-soft: #1d3a31;
  --warm: #e4a64a; --danger: #ec7a63; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { height: 100% }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body);
  -webkit-tap-highlight-color: transparent; display: flex; flex-direction: column }
button, input, textarea, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

header.top { padding: calc(env(safe-area-inset-top, 0px) + 14px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px }
header.top h1 { margin: 0; font: 800 26px/1.1 var(--display); letter-spacing: -.02em; text-wrap: balance }
header.top .date { color: var(--muted); font-size: 13px; white-space: nowrap }

main { flex: 1; overflow-y: auto; padding-block: 4px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.view { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px }

nav.tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 6px) max(8px, env(safe-area-inset-left, 0px)) }
nav.tabs button { background: none; border: 0; padding: 6px 2px; border-radius: 10px; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 600 }
nav.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
nav.tabs button[aria-selected="true"] { color: var(--accent) }
nav.tabs button[aria-selected="true"] svg { background: var(--accent-soft); border-radius: 999px; padding: 2px 14px; width: 52px; box-sizing: content-box }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px }
.label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.row { display: flex; gap: 8px; align-items: center }
.row > input:not([type=checkbox]), .row > textarea { flex: 1; min-width: 0 }
input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); flex: none; margin: 0 }
input[type=text], input[type=number], textarea, select {
  width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; font-size: 16px }
textarea { resize: vertical; min-height: 84px }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 700; white-space: nowrap }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line) }
.btn.small { padding: 7px 12px; font-size: 13px }
.chips { display: flex; gap: 6px; flex-wrap: wrap }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted) }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.empty { text-align: center; color: var(--muted); padding: 28px 12px }
.hint { color: var(--muted); font-size: 13px; margin: 0 }

/* Görevler */
.progress { display: flex; align-items: center; gap: 12px }
.progress .bar { flex: 1; height: 8px; background: var(--accent-soft); border-radius: 99px; overflow: hidden }
.progress .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s }
.progress b { font: 700 15px var(--body); font-variant-numeric: tabular-nums }
ul.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden }
ul.list li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line) }
ul.list li:first-child { border-top: 0 }
.check { width: 24px; height: 24px; flex: none; border-radius: 50%; border: 2px solid var(--line); background: none; display: grid; place-items: center; padding: 0 }
.check svg { width: 14px; height: 14px; stroke: var(--accent-ink); stroke-width: 3; fill: none; opacity: 0 }
li.done .check { background: var(--accent); border-color: var(--accent) }
li.done .check svg { opacity: 1 }
li .txt { flex: 1; min-width: 0; overflow-wrap: anywhere }
li.done .txt { color: var(--muted); text-decoration: line-through }
.del { background: none; border: 0; color: var(--muted); padding: 4px 6px; font-size: 18px; line-height: 1 }
.del:hover { color: var(--danger) }
.tag-ex { font-size: 11px; font-weight: 700; color: var(--warm); border: 1px solid currentColor; border-radius: 6px; padding: 0 5px; margin-left: 6px; vertical-align: 1px }

/* Notlar */
.notes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px }
.note { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; text-align: left; min-width: 0;
  display: flex; flex-direction: column; gap: 6px; min-height: 110px }
.note h3 { margin: 0; font: 700 15px/1.3 var(--body); overflow-wrap: anywhere }
.note p { margin: 0; color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; white-space: pre-line }
.note small { margin-top: auto; color: var(--muted); font-size: 11px }
.editor { display: flex; flex-direction: column; gap: 10px }
.editor input { font-weight: 700 }
.editor textarea { min-height: 240px }

/* Hesap */
.big { font: 800 40px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.02em }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.stat { display: flex; flex-direction: column; gap: 4px }
.stat b { font: 700 20px var(--body); font-variant-numeric: tabular-nums }
.stepper { display: flex; align-items: center; gap: 10px }
.stepper button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 20px; font-weight: 700 }
.stepper output { min-width: 2ch; text-align: center; font: 700 20px var(--body); font-variant-numeric: tabular-nums }

/* Sayaç */
.dial { position: relative; width: min(260px, 70vw); aspect-ratio: 1; max-width: 100%; margin: 6px auto 0 }
.dial svg { width: 100%; height: 100%; transform: rotate(-90deg) }
.dial circle { fill: none; stroke-width: 10 }
.dial .track { stroke: var(--accent-soft) }
.dial .arc { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .5s linear }
.dial .readout { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px }
.dial .readout span { font: 800 52px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.03em }
.dial .readout small { color: var(--muted); font-weight: 600 }
.dial.ring .arc { stroke: var(--warm) }
.controls { display: flex; justify-content: center; gap: 10px }

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; z-index: 20; max-width: calc(100% - 32px) }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>
</head>
<body>
<header class="top">
  <h1 id="title">Görevler</h1>
  <span class="date" id="today"></span>
</header>

<main>
  <!-- GÖREVLER -->
  <section class="view" id="v-todo">
    <div class="card progress"><div class="bar"><i id="todo-bar"></i></div><b id="todo-count">0/0</b></div>
    <form class="row" id="todo-form">
      <input type="text" id="todo-input" placeholder="Yeni görev ekle…" autocomplete="off" aria-label="Yeni görev">
      <button class="btn" type="submit">Ekle</button>
    </form>
    <div class="chips" role="group" aria-label="Filtre">
      <button class="chip" data-f="all" aria-pressed="true">Tümü</button>
      <button class="chip" data-f="open" aria-pressed="false">Yapılacak</button>
      <button class="chip" data-f="done" aria-pressed="false">Bitti</button>
    </div>
    <ul class="list" id="todo-list"></ul>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost small" id="todo-clear">Bitenleri temizle</button></div>
  </section>

  <!-- NOTLAR -->
  <section class="view" id="v-notes" hidden>
    <div id="notes-index" class="view" style="gap:14px">
      <div class="row">
        <input type="text" id="note-search" placeholder="Notlarda ara…" aria-label="Notlarda ara">
        <button class="btn" id="note-new">Yeni</button>
      </div>
      <div class="notes" id="notes-grid"></div>
    </div>
    <div class="editor" id="note-editor" hidden>
      <div class="row" style="justify-content:space-between">
        <button class="btn ghost small" id="note-back">‹ Notlar</button>
        <button class="btn ghost small" id="note-del" style="color:var(--danger)">Sil</button>
      </div>
      <input type="text" id="note-title" placeholder="Başlık" aria-label="Not başlığı">
      <textarea id="note-body" placeholder="Yazmaya başla…" aria-label="Not metni"></textarea>
      <p class="hint">Yazdıkların otomatik kaydedilir.</p>
    </div>
  </section>

  <!-- HESAP BÖL -->
  <section class="view" id="v-bill" hidden>
    <div class="card stat">
      <span class="label">Kişi başı</span>
      <span class="big" id="bill-each">₺0,00</span>
    </div>
    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      <label class="stat"><span class="label">Hesap tutarı (₺)</span>
        <input type="number" id="bill-amount" inputmode="decimal" min="0" step="0.01" value="1250"></label>
      <div class="stat"><span class="label">Bahşiş</span>
        <div class="chips" id="tip-chips">
          <button class="chip" data-tip="0" aria-pressed="false">%0</button>
          <button class="chip" data-tip="5" aria-pressed="false">%5</button>
          <button class="chip" data-tip="10" aria-pressed="true">%10</button>
          <button class="chip" data-tip="15" aria-pressed="false">%15</button>
          <button class="chip" data-tip="20" aria-pressed="false">%20</button>
        </div></div>
      <div class="stat"><span class="label">Kişi sayısı</span>
        <div class="stepper"><button id="ppl-minus" aria-label="Azalt">−</button><output id="ppl">4</output><button id="ppl-plus" aria-label="Artır">+</button></div></div>
      <label class="row" style="gap:10px"><input type="checkbox" id="bill-round"> <span>Kişi başını yukarı yuvarla (tam lira)</span></label>
    </div>
    <div class="split">
      <div class="card stat"><span class="label">Bahşiş</span><b id="bill-tip">₺0</b></div>
      <div class="card stat"><span class="label">Toplam</span><b id="bill-total">₺0</b></div>
    </div>
  </section>

  <!-- SAYAÇ -->
  <section class="view" id="v-timer" hidden>
    <div class="chips" id="preset-chips" style="justify-content:center">
      <button class="chip" data-min="1" aria-pressed="false">1 dk</button>
      <button class="chip" data-min="5" aria-pressed="false">5 dk</button>
      <button class="chip" data-min="10" aria-pressed="false">10 dk</button>
      <button class="chip" data-min="25" aria-pressed="true">25 dk odak</button>
      <button class="chip" data-min="45" aria-pressed="false">45 dk</button>
    </div>
    <div class="dial" id="dial">
      <svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52"/><circle class="arc" id="arc" cx="60" cy="60" r="52"/></svg>
      <div class="readout"><span id="t-read">25:00</span><small id="t-state">Hazır</small></div>
    </div>
    <div class="controls">
      <button class="btn ghost" id="t-reset">Sıfırla</button>
      <button class="btn" id="t-start" style="min-width:120px">Başlat</button>
    </div>
    <p class="hint" style="text-align:center">Süre bitince telefon titrer ve kısa bir ses çalar. Ekran açık kalır.</p>
  </section>
</main>

<nav class="tabs" role="tablist">
  <button role="tab" data-v="todo" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Görevler</button>
  <button role="tab" data-v="notes" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>Notlar</button>
  <button role="tab" data-v="bill" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Hesap</button>
  <button role="tab" data-v="timer" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>Sayaç</button>
</nav>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];
  const store = {
    get(k, d) { try { const v = localStorage.getItem('cep.' + k); return v ? JSON.parse(v) : d } catch { return d } },
    set(k, v) { try { localStorage.setItem('cep.' + k, JSON.stringify(v)) } catch {} }
  };
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const tl = new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY' });
  let toastT;
  const toast = msg => {
    let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.append(el) }
    el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 1800);
  };

  $('#today').textContent = new Date().toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long' });

  // ---------- Sekmeler ----------
  const titles = { todo: 'Görevler', notes: 'Notlar', bill: 'Hesap Böl', timer: 'Sayaç' };
  const show = v => {
    $$('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.v === v));
    $$('main > .view').forEach(s => s.hidden = s.id !== 'v-' + v);
    $('#title').textContent = titles[v]; store.set('tab', v);
  };
  $$('nav.tabs button').forEach(b => b.onclick = () => show(b.dataset.v));

  // ---------- Görevler ----------
  let todos = store.get('todos', null);
  if (!todos) todos = [
    { id: 1, t: 'Market: süt, ekmek, yumurta', d: false, ex: true },
    { id: 2, t: 'Faturayı öde', d: true, ex: true },
    { id: 3, t: 'Annemi ara', d: false, ex: true }
  ];
  let filter = 'all';
  const saveTodos = () => { store.set('todos', todos); renderTodos() };
  const renderTodos = () => {
    const done = todos.filter(x => x.d).length;
    $('#todo-count').textContent = `${done}/${todos.length}`;
    $('#todo-bar').style.width = todos.length ? (done / todos.length * 100) + '%' : '0';
    const items = todos.filter(x => filter === 'all' || (filter === 'done') === x.d);
    $('#todo-list').hidden = !items.length;
    $('#todo-list').innerHTML = items.map(x => `
      <li class="${x.d ? 'done' : ''}" data-id="${x.id}">
        <button class="check" aria-label="${x.d ? 'Geri al' : 'Tamamla'}"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></button>
        <span class="txt">${esc(x.t)}${x.ex ? '<span class="tag-ex">örnek</span>' : ''}</span>
        <button class="del" aria-label="Sil">×</button>
      </li>`).join('');
    let e = $('#todo-empty');
    if (!items.length) { if (!e) { e = document.createElement('p'); e.id = 'todo-empty'; e.className = 'empty'; $('#todo-list').after(e) }
      e.textContent = filter === 'done' ? 'Henüz biten görev yok.' : 'Liste boş. Yukarıdan ilk görevini ekle.' }
    else if (e) e.remove();
  };
  $('#todo-form').onsubmit = e => {
    e.preventDefault(); const t = $('#todo-input').value.trim(); if (!t) return;
    todos.unshift({ id: Date.now(), t, d: false }); $('#todo-input').value = ''; saveTodos();
  };
  $('#todo-list').onclick = e => {
    const li = e.target.closest('li'); if (!li) return; const id = +li.dataset.id;
    if (e.target.closest('.check')) { const x = todos.find(x => x.id === id); x.d = !x.d; saveTodos() }
    else if (e.target.closest('.del')) { todos = todos.filter(x => x.id !== id); saveTodos(); toast('Görev silindi') }
  };
  $$('[data-f]').forEach(b => b.onclick = () => {
    filter = b.dataset.f; $$('[data-f]').forEach(c => c.setAttribute('aria-pressed', c === b)); renderTodos();
  });
  $('#todo-clear').onclick = () => {
    const n = todos.filter(x => x.d).length; todos = todos.filter(x => !x.d); saveTodos();
    toast(n ? `${n} görev temizlendi` : 'Biten görev yok');
  };
  renderTodos();

  // ---------- Notlar ----------
  let notes = store.get('notes', null);
  if (!notes) notes = [
    { id: 1, title: 'Wi-Fi şifresi (örnek)', body: 'Ev: kahve2024\nOfis: misafir-5G', at: Date.now() - 864e5 },
    { id: 2, title: 'Kitap listesi (örnek)', body: 'Tutunamayanlar\nKürk Mantolu Madonna\nSaatleri Ayarlama Enstitüsü', at: Date.now() - 3 * 864e5 }
  ];
  let editing = null;
  const saveNotes = () => store.set('notes', notes);
  const rel = t => { const d = Math.round((Date.now() - t) / 864e5); return d <= 0 ? 'Bugün' : d === 1 ? 'Dün' : `${d} gün önce` };
  const renderNotes = () => {
    const q = $('#note-search').value.toLocaleLowerCase('tr');
    const list = notes.filter(n => (n.title + ' ' + n.body).toLocaleLowerCase('tr').includes(q)).sort((a, b) => b.at - a.at);
    $('#notes-grid').innerHTML = list.length ? list.map(n => `
      <button class="note" data-id="${n.id}"><h3>${esc(n.title || 'Başlıksız')}</h3><p>${esc(n.body)}</p><small>${rel(n.at)}</small></button>`).join('')
      : `<p class="empty" style="grid-column:1/-1">${q ? 'Eşleşen not yok.' : 'Henüz not yok. “Yeni” ile başla.'}</p>`;
  };
  const openNote = n => {
    editing = n; $('#note-title').value = n.title; $('#note-body').value = n.body;
    $('#notes-index').hidden = true; $('#note-editor').hidden = false;
  };
  const closeNote = () => {
    if (editing && !editing.title.trim() && !editing.body.trim()) { notes = notes.filter(n => n !== editing); saveNotes() }
    editing = null; $('#notes-index').hidden = false; $('#note-editor').hidden = true; renderNotes();
  };
  $('#note-new').onclick = () => { const n = { id: Date.now(), title: '', body: '', at: Date.now() }; notes.push(n); openNote(n); $('#note-title').focus() };
  $('#notes-grid').onclick = e => { const b = e.target.closest('.note'); if (b) openNote(notes.find(n => n.id === +b.dataset.id)) };
  ['#note-title', '#note-body'].forEach(s => $(s).oninput = () => {
    editing.title = $('#note-title').value; editing.body = $('#note-body').value; editing.at = Date.now(); saveNotes();
  });
  $('#note-back').onclick = closeNote;
  let delArmed = false;
  $('#note-del').onclick = () => {
    if (!delArmed) { delArmed = true; $('#note-del').textContent = 'Emin misin? Sil'; setTimeout(() => { delArmed = false; $('#note-del').textContent = 'Sil' }, 3000); return }
    notes = notes.filter(n => n !== editing); saveNotes(); editing = null; delArmed = false; $('#note-del').textContent = 'Sil'; closeNote(); toast('Not silindi');
  };
  $('#note-search').oninput = renderNotes;
  renderNotes();

  // ---------- Hesap Böl ----------
  const bill = store.get('bill', { amount: 1250, tip: 10, ppl: 4, round: false });
  $('#bill-amount').value = bill.amount; $('#ppl').textContent = bill.ppl; $('#bill-round').checked = bill.round;
  const calcBill = () => {
    const a = Math.max(0, parseFloat($('#bill-amount').value) || 0);
    const tip = a * bill.tip / 100, total = a + tip;
    let each = total / bill.ppl; if (bill.round) each = Math.ceil(each);
    $('#bill-each').textContent = tl.format(each);
    $('#bill-tip').textContent = tl.format(tip);
    $('#bill-total').textContent = tl.format(bill.round ? each * bill.ppl : total);
    $$('#tip-chips .chip').forEach(c => c.setAttribute('aria-pressed', +c.dataset.tip === bill.tip));
    bill.amount = a; store.set('bill', bill);
  };
  $('#bill-amount').oninput = calcBill;
  $('#tip-chips').onclick = e => { const c = e.target.closest('[data-tip]'); if (c) { bill.tip = +c.dataset.tip; calcBill() } };
  $('#ppl-minus').onclick = () => { bill.ppl = Math.max(1, bill.ppl - 1); $('#ppl').textContent = bill.ppl; calcBill() };
  $('#ppl-plus').onclick = () => { bill.ppl = Math.min(50, bill.ppl + 1); $('#ppl').textContent = bill.ppl; calcBill() };
  $('#bill-round').onchange = e => { bill.round = e.target.checked; calcBill() };
  calcBill();

  // ---------- Sayaç ----------
  const C = 2 * Math.PI * 52; $('#arc').style.strokeDasharray = C;
  let total = 25 * 60, left = total, endAt = 0, tick = null, wake = null, ringing = false;
  const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  const draw = () => {
    $('#t-read').textContent = fmt(Math.ceil(left));
    $('#arc').style.strokeDashoffset = C * (1 - left / total);
    $('#t-start').textContent = tick ? 'Duraklat' : (left < total && left > 0 ? 'Devam' : 'Başlat');
    $('#t-state').textContent = ringing ? 'Süre doldu!' : tick ? 'Çalışıyor' : left < total ? 'Duraklatıldı' : 'Hazır';
    $('#dial').classList.toggle('ring', ringing);
  };
  const beep = () => {
    try { navigator.vibrate && navigator.vibrate([300, 150, 300, 150, 600]) } catch {}
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      [0, .35, .7].forEach(t => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ac.destination);
        g.gain.setValueAtTime(.25, ac.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + t + .3); o.start(ac.currentTime + t); o.stop(ac.currentTime + t + .3) });
    } catch {}
  };
  const lock = async on => { try { if (on && 'wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); else if (!on && wake) { await wake.release(); wake = null } } catch {} };
  const stop = () => { clearInterval(tick); tick = null; lock(false) };
  const start = () => {
    ringing = false; if (left <= 0) left = total; endAt = Date.now() + left * 1000; lock(true);
    tick = setInterval(() => {
      left = Math.max(0, (endAt - Date.now()) / 1000);
      if (left <= 0) { stop(); ringing = true; beep(); toast('Süre doldu') }
      draw();
    }, 250);
    draw();
  };
  $('#t-start').onclick = () => { tick ? stop() : start(); draw() };
  $('#t-reset').onclick = () => { stop(); ringing = false; left = total; draw() };
  $('#preset-chips').onclick = e => {
    const c = e.target.closest('[data-min]'); if (!c) return;
    $$('#preset-chips .chip').forEach(x => x.setAttribute('aria-pressed', x === c));
    stop(); ringing = false; total = left = +c.dataset.min * 60; draw();
  };
  document.addEventListener('visibilitychange', () => { if (tick && document.visibilityState === 'visible') lock(true) });
  draw();

  show(store.get('tab', 'todo'));

  // Çevrimdışı çalışma (yalnızca kendi sunucusunda; önizleme ortamında sessizce atlanır)
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    try { navigator.serviceWorker.register('sw.js').catch(() => {}) } catch {}
  }
})();
</script>
</body>
</html>
